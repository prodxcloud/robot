server:
  host: "0.0.0.0"
  port: 8788
  threads: 8

rate_limit:
  default_requests_per_minute: 60
  default_tokens_per_minute: 100000
  burst_multiplier: 2.0

# ── SLM-Models service ────────────────────────────────────────────────────────
# All model training, fine-tuning, and inference is handled by the SLM-Models
# Python service. This application only orchestrates agents and routes requests.
slm_service:
  url: "http://slm-models:8000"   # override with SLM_SERVICE_URL env var

agents:
  max_agents_per_tenant: 50
  default_timeout_ms: 30000
  thread_pool_size: 16

storage:
  vector_store_path: "data/vectors"

vector_store:
  dimension: 768
  max_vectors: 1000000
  path: "data/vectors"

telemetry:
  log_level: "info"
  log_format: "json"
  otlp_endpoint: "http://localhost:4317"
  prometheus_enabled: false

# Remote model catalog — these are served by SLM-Models, not loaded locally
models_config: "config/models.yaml"
