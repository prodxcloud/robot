# Option A — HTTP only (use with Cloudflare Tunnel or behind a TLS-terminating proxy)
# Proxies to the C++ AI Engine on port 8788

upstream api_backend {
    server api-server:8788;
    keepalive 32;
}

server {
    listen 80;
    server_name connector.valtunox.com;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip for API responses
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types application/json application/grpc text/plain text/xml;

    # REST API — proxy to C++ engine
    location / {
        proxy_pass         http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts suitable for AI inference requests
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Buffer settings for large model responses
        proxy_buffering       on;
        proxy_buffer_size     16k;
        proxy_buffers         8 16k;
    }

    # Health check (used by nginx & docker healthcheck)
    location /health {
        access_log off;
        proxy_pass http://api_backend/health;
        proxy_connect_timeout 5s;
        proxy_read_timeout    5s;
    }

    # Prometheus metrics — internal access only
    location /metrics {
        allow 127.0.0.1;
        allow 172.0.0.0/8;   # Docker bridge networks
        deny  all;
        proxy_pass http://api_backend/metrics;
    }
}
