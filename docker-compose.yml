# =============================================================================
# AgentControl Service — Docker Compose (Production)
# Domain  : agents.valtunox.com
# Entry   : nginx on port 80/443  →  C++ AI Engine on port 8788 (internal)
# =============================================================================

services:

  # ── C++ AI Engine — REST :8788 | gRPC :50051 ──────────────────────────────
  api-server:
    container_name: valtunox-agentcontrol
    image: ${API_IMAGE:-valtunox/agentcontrol:latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8788"
      - "50051"
    environment:
      - PRODXCLOUD_LOG_LEVEL=${LOG_LEVEL:-info}
      - SLM_SERVICE_URL=${SLM_SERVICE_URL:-http://slm-models:8000}
    volumes:
      - ./config:/etc/valtunox:ro
      - vector-data:/app/data/vectors
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8788/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - agentcontrol_network
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  # ── Nginx reverse proxy — HTTP :80 / HTTPS :443 → api-server:8788 ─────────
  nginx:
    container_name: valtunox-agentcontrol-nginx
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/${NGINX_CONF:-default.conf}:/etc/nginx/conf.d/default.conf:ro
      - ${SSL_CERTS_PATH:-./certs}:/etc/nginx/ssl:ro
    depends_on:
      api-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - agentcontrol_network
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  vector-data:
    driver: local

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  agentcontrol_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${SUBNET:-192.168.91.0/24}
